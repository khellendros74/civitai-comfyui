<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body
        {
            background: #0f0f1a;
            color: #e0e0ff;
            font-family: 'Segoe UI', system-ui, sans-serif;
            width: 240px;
            padding: 16px;
        }

        header
        {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
        }

        .logo
        {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, #7c6af7, #a78bfa);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        h1 { font-size: 14px; font-weight: 700; color: #c7d2fe; }

        p
        {
            font-size: 12px;
            color: #64748b;
            line-height: 1.5;
            margin-bottom: 14px;
        }

        button
        {
            width: 100%;
            padding: 9px;
            border-radius: 7px;
            border: none;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            background: #7c6af7;
            color: #fff;
            transition: background 0.2s;
        }

        button:hover { background: #6d5ce7; }

        .status
        {
            font-size: 11px;
            color: #64748b;
            text-align: center;
            margin-top: 10px;
        }

        .dot
        {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #374151;
            margin-right: 5px;
            vertical-align: middle;
        }
        .dot.ok   { background: #6ee7b7; }
        .dot.err  { background: #f87171; }
    </style>
</head>
